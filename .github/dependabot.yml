version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # Dockerfile (base images, the uv image).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # docker-compose*.yml (postgres, redis). Dependabot treats compose as its own ecosystem.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
