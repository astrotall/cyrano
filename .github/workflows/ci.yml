name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      # Same tag as docker-compose.yml: database tests run against real PostgreSQL.
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: cyrano
          POSTGRES_PASSWORD: change-me
          POSTGRES_DB: cyrano
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U cyrano -d cyrano"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      # Explicit, not implicit: the interpreter version comes from .python-version.
      - name: Install Python
        run: uv python install "$(cat .python-version)"

      - name: Install dependencies
        run: make install

      - name: Lint, format check, type check
        run: make check

      - name: Tests
        run: make test
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://cyrano:change-me@127.0.0.1:5432/postgres

  # Validates the Docker setup only: no push, no registry, no long-running service is started.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Create .env from the example
        run: cp .env.example .env

      - name: Validate compose files (with and without the dev override)
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.yml config --quiet
          docker compose config --quiet migrate

      - name: Build images
        run: docker compose build

      - name: Check that the image contains the migrations (no database needed)
        run: docker compose run --rm --no-deps migrate alembic heads
