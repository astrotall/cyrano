name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit sha to deploy, 40 lowercase hex characters
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  DEPLOY_PATH: /opt/cyrano

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          case "$DEPLOY_SHA" in
            *[!0-9a-f]*) echo "the sha must be 40 lowercase hex characters"; exit 2 ;;
          esac
          if [ "${#DEPLOY_SHA}" -ne 40 ]; then
            echo "the sha must be 40 lowercase hex characters"
            exit 2
          fi
          case "${DEPLOY_PORT:-22}" in
            *[!0-9]*) echo "the port must be a number"; exit 2 ;;
          esac
          key_file="$RUNNER_TEMP/deploy_key"
          hosts_file="$RUNNER_TEMP/deploy_known_hosts"
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$key_file"
          chmod 600 "$key_file"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$hosts_file"
          ssh \
            -i "$key_file" \
            -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$hosts_file" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "$DEPLOY_PATH/scripts/deploy.sh $DEPLOY_SHA"

      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/deploy_key" "$RUNNER_TEMP/deploy_known_hosts"
