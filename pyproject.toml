[project]
name = "cyrano"
version = "0.1.0"
description = "Telegram assistant: a Telethon userbot chatting in the owner's style, controlled via an aiogram bot."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    # Typed, env-driven configuration (pulls in pydantic v2).
    "pydantic-settings>=2.6",
    # WorkerSettings / RedisSettings for the delayed-jobs worker.
    "arq>=0.26",
    # IANA tz database: python:slim has no system tzdata, and TIMEZONE is validated at startup.
    "tzdata>=2024.2",
    # Async ORM, its PostgreSQL driver and schema migrations.
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.30",
    "alembic>=1.14",
    # MTProto client for the userbot on the second account; untyped, so mypy has an override.
    "telethon>=1.45",
    # Control bot on the owner's main account; ships type information.
    "aiogram>=3.31,<4",
    # Plain HTTP client for the LLM provider; imported only inside llm/. No provider SDK.
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific
    "S",        # bandit-style security checks
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311", "RUF001"]  # asserts, fake secrets, seeded randomness and Cyrillic fixtures are fine in tests
"src/cyrano/services/humanization.py" = ["S311"]  # the night boundaries are deterministic per date, not a secret
"src/cyrano/bot/messages.py" = ["RUF001"]  # the owner-facing texts are Russian
"src/cyrano/services/reply_postprocess.py" = ["RUF001"]  # the speaker prefixes and quotes are not ASCII
"src/cyrano/stop_trigger_patterns.py" = ["RUF001"]  # the stop-trigger patterns are Russian
"src/cyrano/gender_name_data.py" = ["RUF001"]  # the name data is Russian
"src/cyrano/prompts/texts.py" = ["RUF001"]  # the grammar examples in the instructions are Russian

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "migrations"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["telethon", "telethon.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
